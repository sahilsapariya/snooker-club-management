name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile (format, lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. The action reads the pinned version from
      # package.json's "packageManager" field, and declaring it in both places
      # is a hard error ("Multiple versions of pnpm specified").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

      - run: pnpm test:ci
        env:
          # The app validates its configuration at import time. These are
          # placeholders for the test run; nothing here reaches a real project.
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-0000000000000000000000
          EXPO_PUBLIC_APP_ENV: test

  database:
    name: Database (migrations, lint, RLS tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Starts Postgres, applies every migration in order and runs seed.sql.
      # A migration that does not apply from scratch fails here.
      - name: Start Supabase
        run: supabase start -x realtime,storage-api,imgproxy,studio,mailpit,vector

      - name: Lint schema
        run: supabase db lint --level warning

      # The security suite: tenant isolation, role authorization, business
      # rules. Runs as the `authenticated` role so RLS is actually in force.
      - name: Run pgTAP tests
        run: supabase test db

      # A drifted checked-in types file means the client is typed against a
      # schema that no longer exists.
      - name: Check generated types are current
        run: |
          supabase gen types typescript --local --schema public \
            > /tmp/database.types.ts
          if ! diff -q /tmp/database.types.ts apps/mobile/src/types/database.types.ts; then
            echo "::error::apps/mobile/src/types/database.types.ts is out of date. Run 'pnpm db:types' and commit the result."
            diff -u apps/mobile/src/types/database.types.ts /tmp/database.types.ts | head -60
            exit 1
          fi

  bundle:
    name: Metro bundle
    runs-on: ubuntu-latest
    needs: mobile
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. The action reads the pinned version from
      # package.json's "packageManager" field, and declaring it in both places
      # is a hard error ("Multiple versions of pnpm specified").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Proves the app actually builds, which typecheck alone does not.
      - name: Export Android bundle
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-0000000000000000000000
          EXPO_PUBLIC_APP_ENV: production
        run: pnpm exec expo export --platform android --output-dir ../../dist-ci
